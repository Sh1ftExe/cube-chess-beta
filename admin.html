<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CUBE V2 — редактор</title>
<style>
:root{--bg:#eee5d7;--card:#f8f3ea;--ink:#25352d;--green:#3f584a;--gold:#b88543;--line:rgba(37,53,45,.14)}
*{box-sizing:border-box}body{margin:0;padding:22px;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
main{width:min(920px,100%);margin:auto}h1{margin-bottom:6px}.lead{color:#6f7b74}
section{margin:15px 0;padding:21px;border:1px solid var(--line);border-radius:17px;background:var(--card)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{display:block;font-size:12px;font-weight:700}
input,textarea{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:white}
textarea{min-height:80px}.actions{position:sticky;bottom:10px;display:flex;gap:10px;padding:13px;border-radius:15px;background:rgba(37,53,45,.95)}
button{padding:13px 18px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.primary{background:var(--gold);color:white}.secondary{background:white;color:var(--ink)}
.note{padding:14px;border-radius:13px;background:#f0dcba;font-size:13px}
@media(max-width:650px){body{padding:10px}.grid{grid-template-columns:1fr}.actions{flex-direction:column}button{width:100%}}
</style>
</head>
<body>
<main>
<h1>CUBE V2 — редактор</h1>
<p class="lead">Меняй данные и скачивай новый site-data.js.</p>
<div class="note">После скачивания замени старый файл site-data.js в GitHub и нажми Commit changes.</div>
<form id="editor">
<section><h2>Социальные сети</h2><div class="grid">
<label>Ссылка на Telegram<input name="telegram" placeholder="https://t.me/..."></label>
<label>Ссылка на MAX<input name="max" placeholder="https://max.ru/..."></label>
</div></section>
<section><h2>Клуб</h2><div class="grid">
<label>Главный текст<textarea name="heroText"></textarea></label>
<label>Телефон для показа<input name="phoneDisplay"></label>
<label>Телефон цифрами<input name="phoneRaw"></label>
<label>Адрес<input name="address"></label>
<label>Ориентир<input name="landmark"></label>
</div></section>
<section><h2>Турнир</h2><div class="grid">
<label>Название<input name="tTitle"></label>
<label>Дата<input name="tDate"></label>
<label>Число на афише<input name="tDay"></label>
<label>Месяц на афише<input name="tMonth"></label>
<label>Регистрация<input name="tRegistration"></label>
<label>Формат<input name="tFormat"></label>
<label>Взнос<input name="tPrice"></label>
</div><label>Описание<textarea name="tDescription"></textarea></label></section>
<section><h2>Тренер</h2><div class="grid">
<label>Имя<input name="coachName"></label>
<label>Должность<input name="coachRole"></label>
</div><label>Описание<textarea name="coachText"></textarea></label></section>
<div class="actions">
<button class="primary" type="submit">Скачать site-data.js</button>
<button class="secondary" type="button" id="site">Открыть сайт</button>
</div>
</form>
</main>
<script src="site-data.js"></script>
<script>
const d=window.CUBE_DATA,f=document.getElementById("editor"),t=d.tournaments[0];
const map={telegram:d.socials?.telegram||"",max:d.socials?.max||"",heroText:d.club.heroText,phoneDisplay:d.club.phoneDisplay,phoneRaw:d.club.phoneRaw,address:d.club.address,landmark:d.club.landmark,tTitle:t.title,tDate:t.date,tDay:t.day,tMonth:t.month,tRegistration:t.registration,tFormat:t.format,tPrice:t.price,tDescription:t.description,coachName:d.coach.name,coachRole:d.coach.role,coachText:d.coach.text};
Object.entries(map).forEach(([k,v])=>f.elements[k].value=v);
f.addEventListener("submit",e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f).entries());const copy=structuredClone(d);
copy.socials={telegram:v.telegram,max:v.max};copy.club.heroText=v.heroText;copy.club.phoneDisplay=v.phoneDisplay;copy.club.phoneRaw=v.phoneRaw.replace(/\D/g,"");copy.club.address=v.address;copy.club.landmark=v.landmark;
Object.assign(copy.tournaments[0],{title:v.tTitle,date:v.tDate,day:v.tDay,month:v.tMonth,registration:v.tRegistration,format:v.tFormat,price:v.tPrice,description:v.tDescription});
Object.assign(copy.coach,{name:v.coachName,role:v.coachRole,text:v.coachText});
const blob=new Blob(["window.CUBE_DATA = "+JSON.stringify(copy,null,2)+";\n"],{type:"text/javascript"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="site-data.js";a.click();URL.revokeObjectURL(url)});
document.getElementById("site").onclick=()=>window.open("index.html","_blank");
</script>
</body></html>
